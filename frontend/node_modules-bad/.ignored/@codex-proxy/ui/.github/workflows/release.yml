name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version
        run: node --input-type=module -e 'import pkg from "./package.json" with { type:"json" }; if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) throw new Error("Tag must match package.json version")'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build playground
        run: pnpm build:playground --base "/${{ github.event.repository.name }}/"
      - run: pnpm pack --pack-destination artifacts
      - name: Checksum package
        run: |
          version="$(node -p 'require("./package.json").version')"
          cd artifacts
          sha256sum "codex-proxy-ui-${version}.tgz" > "codex-proxy-ui-${version}.tgz.sha256"
      - name: Publish downloadable archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/codex-proxy-ui-${version}.tgz" \
            "artifacts/codex-proxy-ui-${version}.tgz.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release/notes.md "${flags[@]}"
      - name: Upload playground
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: playground/.vitepress/dist

  playground:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
